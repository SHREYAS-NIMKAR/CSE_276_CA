services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ai_governance
      POSTGRES_USER: postgres_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-localdev_admin_pw}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres_init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres_admin -d ai_governance"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgres://app_user:${APP_DB_PASSWORD:-localdev_app_pw}@postgres:5432/ai_governance
      SESSION_SECRET: ${SESSION_SECRET:-replace-with-32-byte-random-secret-in-production}
      SESSION_LIFETIME_SECONDS: 28800
      ALLOWED_ORIGINS: http://localhost:3000
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads

volumes:
  pgdata:
  uploads:
